<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>

    <style>
        :root {
            --bg: rgb(70, 11, 126);
            --container-bg: rgb(40, 9, 68);
            --display-bg: rgb(2, 22, 3);
            --text-green: rgb(17, 163, 17);

            --btn-size: 75px;
            --btn-height: 70px;
            --radius: 15px;
            --radius-big: 40px;

            --shadow: 0px 0px 12px rgba(0, 0, 0, 0.9);
            --shadow-strong: 0px 0px 30px rgba(0, 0, 0, 1);

            --transition: 300ms;

            --btn-bg: rgb(60, 0, 116);
            --btn-hover: rgb(167, 106, 224);

            --danger: rgb(204, 23, 23);
            --danger-hover: rgb(105, 11, 11);

            --success: rgb(17, 216, 17);
            --success-hover: rgb(10, 138, 10);

            --dark-btn: rgb(29, 2, 65);
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg);
            margin: 0;
            font-family: Roboto;
        }

        .container {
            background-color: var(--container-bg);
            width: 400px;
            border-radius: var(--radius-big);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            box-shadow: var(--shadow-strong);
            border: 6px solid black;
            padding: 20px 0 30px 0;
        }

        .display {
            width: 300px;
            height: 100px;
            box-shadow: var(--shadow);
            border: 4px solid black;
            border-radius: var(--radius);
            background-color: var(--display-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        p {
            width: 280px;
            height: 80px;
            font-size: 50px;
            font-weight: bold;
            color: var(--text-green);
            text-shadow: 0px 0px 6px rgba(17, 163, 17, 0.5);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(4, var(--btn-size));
            gap: 12px;
        }

        .btn {
            width: var(--btn-size);
            height: var(--btn-height);
            border: none;
            border-radius: var(--radius);
            font-size: 30px;
            background-color: var(--btn-bg);
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform var(--transition);
            box-shadow: var(--shadow);
        }

        .btn:hover {
            transform: scale(1.1);
            background-color: var(--btn-hover);
        }

        .btn1 {
            background-color: var(--danger);
            color: black;
        }

        .btn1:hover {
            background-color: var(--danger-hover);
        }

        .btn2 {
            background-color: var(--success);
            color: black;
            font-size: 20px;
        }

        .btn2:hover {
            background-color: var(--success-hover);
            color: white;
        }

        .btn3 {
            background-color: var(--dark-btn);
            color: black;
        }

        .btn3:hover {
            background-color: rgb(73, 11, 145);
            color: white;
        }

        .btn4 {
            grid-column: span 4;
            height: var(--btn-height);
            border: none;
            border-radius: var(--radius);
            font-size: 30px;
            font-weight: bold;
            background-color: var(--success);
            cursor: pointer;
            transition: transform var(--transition);
            box-shadow: var(--shadow);
        }

        .btn4:hover {
            background-color: var(--success-hover);
            transform: scale(1.1);
        }

        @media (max-width: 500px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="display">
            <p id="result"></p>
        </div>

        <div class="keyboard">
            <button value="C" class="btn btn1">C</button>
            <button value="0" class="btn">0</button>
            <button value="." class="btn btn3">.</button>
            <button value="+" class="btn btn3">+</button>
            <button value="1" class="btn">1</button>
            <button value="2" class="btn">2</button>
            <button value="3" class="btn">3</button>
            <button value="-" class="btn btn3">-</button>
            <button value="4" class="btn">4</button>
            <button value="5" class="btn">5</button>
            <button value="6" class="btn">6</button>
            <button value="*" class="btn btn3">*</button>
            <button value="7" class="btn">7</button>
            <button value="8" class="btn">8</button>
            <button value="9" class="btn">9</button>
            <button value="/" class="btn btn3">/</button>
            <button value="=" class="btn4">=</button>
        </div>
    </div>
</body>

<script>
    const buttons = document.querySelectorAll('button');
    const display = document.getElementById('result');

    buttons.forEach(button => {
        button.addEventListener('click', () => {
            if (button.value == 'C') {
                display.textContent = "";
            } else if (button.value === "=") {
                try {
                    display.textContent = eval(display.textContent);
                } catch {
                    display.textContent = "Error";
                }
            } else {
                display.textContent += button.value;
            }
        })
    })
</script>
</html>
