<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>

    <style>

        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: rgb(35, 11, 58);
            font-family: Arial, sans-serif;
        }

        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .top{
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .options{
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #result{
            font-size: 25px;
            font-weight: bold;
            padding: 20px 40px;
            min-width: 350px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            background-color: rgb(78, 18, 128);
            text-align: center;
            color: white;
        }

        button{
            padding: 20px 30px;
            font-size: 20px;
            font-weight: bold;
            background-color: rgb(209, 23, 209);
            color: white;
            border-radius: 15px;
            border: none;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.6);
            transition: all 300ms;
            cursor: pointer;
        }

        button:hover{
            background-color: rgba(209, 23, 209, 0.6);
            transform: scale(1.05);
        }

        #btn5{
            padding: 20px;
            font-size: 20px;
            width: 120px;
            border-radius: 15px;
            border: none;
            outline: none;
            text-align: center;
            background-color: rgb(78, 18, 128);
            color: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.6);
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="top">
            <div id="result">Click Generate</div>
            <button id="button">Generate</button>
            <button id="reset">Reset</button>
        </div>

        <div class="options">
            <button id="btn1">Without Symbols</button>
            <button id="btn2">Without Uppercase</button>
            <button id="btn3">Without Lowercase</button>
            <button id="btn4">Without Numbers</button>

            <input type="number" id="btn5" min="4" max="50" value="12">
        </div>

    </div>

    <script src="password generator.js"></script>

</body>
</html>
