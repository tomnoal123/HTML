<!DOCTYPE html>
<html lang="en">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<head>
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
   
    background: linear-gradient(135deg, #2c003e, #5c258d, #4389a2);
    position: relative;
    height: 3000px;
    
}

    #userbox {
  position: fixed;
  top: 0;
  left: 0;
  
  width: 100%;
  height: 70px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 20px 0 50px;

  background: rgba(20, 20, 40, 0.4);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}


#navlist {
  list-style: none;
  display: flex;
 gap: 420px;
}

#navlist li a {
  text-decoration: none;
  font-size: 18px;
  color: white;
  font-family: 'Poppins', sans-serif;
  transition: 0.2s;
}

#navlist li a:hover {
  color: rgb(180, 120, 255);
}

#logout {
  font-size: 18px;
  font-weight: bold;
  text-decoration: none;
  color: rgb(196, 34, 174);
  font-family: 'Poppins', sans-serif;
  padding: 6px 12px;
  border-radius: 8px;
  transition: 0.2s;
}

#logout:hover {
  background: rgba(255,255,255,0.1);
  color: white;
}
#tasks{
  display: flex;
  flex-direction: row;
  gap: 20px;
  position: absolute;
  top: 110px;
  left: 40px;
  padding: 40px 0;
}
#tasks input{
  height: 50px;
  width: auto;
  padding: 15px 0px 15px 25px;
  font-size: 1.5em;
  border-radius: 20px;
  border: 1px #7e0c88;
  border-style: solid;
  font-style: italic;
  color: rgb(196, 34, 174);
  background-color: transparent;
}
#tasks input:focus{
  outline: none;
  text-decoration: none;
}
#tasks input::placeholder{
  color:rgb(196, 34, 174, 0.45);
}
#tasks input:focus::placeholder {
    color: transparent;
}
#create{
    background-color: rgb(18, 163, 18);
    color: white;
    border-color: green;
    border-style: solid;
    font-size: 1.5em;
    padding: 10px 15px;
    border-radius: 15px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0,  0.4);
    cursor: pointer;
}
#create:hover{
  opacity: 0.7;
}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Todoapp</title>
</head>
<body>
    <div id="userbox">
    
    <ul id="navlist">
        <li><a href="todoapp.html">Home</a></li>
        <li><a href="#">Calendar</a></li>
        <li><a href="todoapp.task.html">Tasks</a></li>
    </ul>

    <a id="logout" href="../logowanie/main-login.html">Logout</a>

</div>
<div id="tasks">
    <input  id="task-input" type="text" placeholder="Enter your task">
    <button id="create">Create task</button>
    
</div>
  <script src="../aplikacja/todo.js">

  </script>
</body>
</html>
