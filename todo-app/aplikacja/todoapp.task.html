<!DOCTYPE html>
<html lang="en">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<head>
    <style>
        :root {
    --font-main: 'Poppins', sans-serif;

    --bg-gradient: linear-gradient(135deg, #2c003e, #5c258d, #4389a2);

    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.15);

    --text-color: white;

    --accent: rgb(196, 34, 174);
    --accent-hover: rgb(180, 120, 255);

    --radius: 12px;
    --blur: 8px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg-gradient);
    position: relative;
    height: 3000px;
    font-family: var(--font-main);
}

#userbox {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 70px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 20px 0 50px;

    background: rgba(20, 20, 40, 0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

#navlist {
    list-style: none;
    display: flex;
    gap: 420px;
}

#navlist li a {
    text-decoration: none;
    font-size: 18px;
    color: var(--text-color);
    font-family: var(--font-main);
    transition: 0.2s;
}

#navlist li a:hover {
    color: var(--accent-hover);
}

#logout {
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
    color: var(--accent);
    font-family: var(--font-main);
    padding: 6px 12px;
    border-radius: 8px;
    transition: 0.2s;
}

#logout:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text-color);
}

#tasks-box {
    display: flex;
    flex-direction: row;
    gap: 20px;

    position: absolute;
    top: 110px;
    left: 40px;

    padding: 40px 0;
}

#list {
    padding-left: 0;
    margin-left: 0;
}

#list li {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 12px 16px;
    margin-bottom: 12px;

    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);

    color: var(--text-color);
    font-family: var(--font-main);
    font-size: 18px;

    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));

    transition: 0.2s;
}

#list li:hover {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.12);
}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Todoapp</title>
</head>
<body>
    <div id="userbox">
    
    <ul id="navlist">
        <li><a href="todoapp.html">Home</a></li>
        <li><a href="#">Calendar</a></li>
        <li><a href="todoapp.task.html">Tasks</a></li>
    </ul>

    <a id="logout" href="../logowanie/main-login.html">Logout</a>
</div>
    <div id="tasks-box">
        <ol id="list"></ol>
    </div>
    <script src="../aplikacja/todo-tasks.js"></script>
</body>
</html>
