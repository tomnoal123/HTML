<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --primary:white;
        }

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            background-size: cover;
            background-image: url(../style/main-photo-background.jpg);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container{
            width: 800px;
            height: 600px;
            border: 3px solid var(--primary);
            border-radius: 15px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.40);
            display: flex;
            overflow: hidden;
        }

        #return-box,
        #box{
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        #return-box{
            border-right: 3px solid var(--primary);
            background-color: var(--primary);
            position: relative;
            overflow: hidden;
        }

        #return-box::before{
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(80, 12, 94, 0.2);
            border-radius: 50%;
            top: -150px;
            left: -150px;
            z-index: 0;
        }

        .return-box{
            z-index: 1;
            color: rgb(72, 19, 122);
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .back{
            position: absolute;
            top: 5px;
            left: 10px;
            text-decoration: none;
            color: rgb(72, 19, 122);
            font-weight: 500;
        }

        #box{
            background-color: transparent;
            backdrop-filter: blur(30px);
            text-align: center;
            color: white;
        }

        #Register-box{
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .username-box,
        .password-box{
            position: relative;
        }

        #username-input,
        #password-input,
        #repeat-password-input{
            width: 100%;
            height: 45px;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--primary);
            outline: none;
            color: white;
        }

        .username-box label,
        .password-box label{
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            transition: 0.3s;
            pointer-events: none;
        }

        .username-box input:focus ~ label,
        .username-box input:valid ~ label,
        .password-box input:focus ~ label,
        .password-box input:valid ~ label{
            top: -8px;
            font-size: 0.8rem;
        }

        .checkbox-box{
            display: flex;
            justify-content: center;
            gap: 10px;
            color: white;
            margin-top: 10px;
        }

        .Signup-box{
            display: flex;
            justify-content: center;
            margin-top: 45px;
        }

        .sign-button{
            padding: 30px 85px;
            font-size: 25px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            background-color: var(--primary);
            color: black;
            cursor: pointer;
            transition: 0.3s;
        }

        .sign-button:hover{
            transform: scale(1.05);
            background-color: rgb(80, 12, 94);
            color: rgb(30, 169, 224);
        }

        .return-button{
            padding: 15px 20px;
            font-size: 15px;
            border-radius: 15px;
            border: none;
            background-color: rgb(107, 6, 107);
            color: var(--primary);
            cursor: pointer;
            transition: 0.3s;
        }

        .return-button:hover{
            transform: scale(1.03);
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="container">

        <section id="return-box">
            <div class="return-box">

                <a class="back" href="main-login.html"><-- back</a>

                <h1 class="welcome-page">Welcome Page</h1><br>
                <p>Do you have an account?</p>

                <button class="return-button" onclick="location.href='main-login.html'">Log in</button>

            </div>
        </section>

        <section id="box">
            <form id="user-data-form">

                <div id="Register-box">

                    <h1 class="create-account-header">Create a account</h1>

                    <div class="username-box">
                        <input id="username-input" type="text" name="username" required>
                        <label for="username-input">Username</label>
                    </div>

                    <div class="password-box">
                        <input id="password-input" type="password" name="password" required>
                        <label for="password-input">Password</label>
                    </div>

                    <div class="password-box">
                        <input id="repeat-password-input" type="password" name="confirmedPassword" required>
                        <label for="repeat-password-input">Confirm password</label>
                    </div>

                </div>

                <div class="checkbox-box">
                    <input id="checkbox" type="checkbox">
                    <p>I accept a terms of the agreement</p>
                </div>

                <div class="Signup-box">
                    <button id="sign-button" class="sign-button">SIGN UP</button>
                </div>

            </form>
        </section>

    </div>

    <script type="module" src="../js/register.js"></script>
</body>
</html>
